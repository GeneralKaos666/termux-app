name: "Validate Gradle Wrapper"

on:
  push:
    branches:
      - master
      - android-10
  pull_request:
    branches:
      - master
      - android-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
