name: Attach Release APKs To Release

on:
  release:
    types:
      - published

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload release assets and delete them on failure
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Build and attach APKs to release
        shell: bash {0}
        env:
          # Only this step calls `gh`; the rest of the job needs no token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          TERMUX_RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
          TERMUX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEYSTORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
          TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEY_PASSWORD }}
        run: |
          # Drops only the assets this leg may have attached, so the other package variant can
          # still publish its own set. The release and its tag are left in place.
          delete_own_assets() {
              [ -n "${APK_BASENAME_PREFIX:-}" ] || return 0
              for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
                  gh release delete-asset "$RELEASE_VERSION_NAME" "${APK_BASENAME_PREFIX}_$abi.apk" --yes
              done
              gh release delete-asset "$RELEASE_VERSION_NAME" "${APK_BASENAME_PREFIX}_sha256sums" --yes
          }

          exit_on_error() {
              echo "$1"
              echo "Deleting the assets of '$RELEASE_VERSION_NAME' that this leg attached"
              delete_own_assets
              exit 1
          }

          echo "Setting vars"
          RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          echo "Preparing the release signing key"
          if [ -z "$TERMUX_RELEASE_KEYSTORE_BASE64" ] || [ -z "$TERMUX_RELEASE_KEYSTORE_PASSWORD" ] || \
             [ -z "$TERMUX_RELEASE_KEY_ALIAS" ] || [ -z "$TERMUX_RELEASE_KEY_PASSWORD" ]; then
            exit_on_error "The release signing secrets are not all set (TERMUX_RELEASE_KEYSTORE_BASE64, TERMUX_RELEASE_KEYSTORE_PASSWORD, TERMUX_RELEASE_KEY_ALIAS, TERMUX_RELEASE_KEY_PASSWORD)."
          fi
          export TERMUX_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$TERMUX_RELEASE_KEYSTORE_BASE64" | base64 -d > "$TERMUX_RELEASE_KEYSTORE_PATH"
          chmod 600 "$TERMUX_RELEASE_KEYSTORE_PATH"
          export TERMUX_RELEASE_SIGNING_REQUIRED=1

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME+${{ env.PACKAGE_VARIANT }}-github-release"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "Checking the tag against the app version"
          expected="${RELEASE_VERSION_NAME#v}"
          actual="$(./gradlew -q versionName | tail -1)"
          [ "$expected" = "$actual" ] || exit_on_error "Tag '$expected' does not match app/build.gradle versionName '$actual'"
          export TERMUX_APP_VERSION_NAME="$expected" # Used by app/build.gradle

          echo "Building APKs for '$APK_VERSION_TAG' release"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          export TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS=1 # Build the five ABI APKs for the release assets
          if ! ./gradlew assembleRelease; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' release."
          fi

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Validating the release signature"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify \
              --print-certs "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              exit_on_error "The '$abi' APK is not signed by the release key."
            fi
          done

          echo "Generating sha25sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for '$APK_VERSION_TAG' release."
          fi

          echo "Attaching APKs to github release"
          if ! gh release upload "$RELEASE_VERSION_NAME" \
          "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" \
          "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
          "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
          "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86_64.apk" \
          "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86.apk" \
          "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums" \
          --clobber; then
            exit_on_error "Attach APKs to release failed for '$APK_VERSION_TAG' release."
          fi
