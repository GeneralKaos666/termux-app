name: Unit tests

on:
  push:
    branches:
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - master
      - 'github-releases/**'

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Setup java 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Cache Gradle
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-
    - name: Cache Robolectric android-all jars
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-m2-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
    - name: Cache bootstrap archives
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: app/src/main/cpp/bootstrap-*.zip
        key: bootstrap-${{ hashFiles('app/build.gradle') }}

    - name: Execute tests
      run: |
        ./gradlew test
    - name: Run lint
      run: |
        ./gradlew lint

  shell:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Lint shell scripts
      run: shellcheck -S warning scripts/termux-backup/termux-backup scripts/termux-backup/lib/*.sh scripts/termux-backup/tests/*.sh scripts/termux-backup/install.sh
    - name: Run termux-backup tests
      run: bash scripts/termux-backup/tests/run.sh
