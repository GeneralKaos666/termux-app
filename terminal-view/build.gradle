apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace = "com.termux.view"
    compileSdkVersion project.properties.compileSdkVersion.toInteger()

    dependencies {
        implementation "androidx.annotation:annotation:1.11.0"
        api project(":terminal-emulator")
    }

    defaultConfig {
        aarMetadata {
            minCompileSdk = 1
        }

        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // TerminalBuffer (from :terminal-emulator) calls android.os.SystemClock and references
        // android.graphics.Bitmap/Rect, which are inert stubs in the unit-test runtime.
        unitTests.returnDefaultValues = true
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
}

kotlin {
    compilerOptions {
        // Java classes in :termux-shared and :app implement TerminalViewClient and rely on its
        // default onLinkClicked method. Kotlin would otherwise emit DefaultImpls only, which Java
        // implementors cannot inherit, so real JVM default methods are required. all-compatibility
        // additionally keeps DefaultImpls for consumers of the already published AAR.
        // `enable` is the renamed `all-compatibility`: real JVM default methods plus retained
        // DefaultImpls, which is what Java implementors and existing AAR consumers need.
        freeCompilerArgs.add("-jvm-default=enable")
    }
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-view'
                version = System.getenv("VERSION") ?: '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}

